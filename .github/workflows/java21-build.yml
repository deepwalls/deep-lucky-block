name: Java 21 build

on:
  push:
    branches: [arena/01a0da6a-deep-lucky-block, arena/01a0e366-deep-lucky-block, arena/7cdbe3b3-deep-lucky-block]
    paths:
      - '.github/workflows/java21-build.yml'
      - 'deep_lucky_block_mcreator.zip'
      - 'mod.zip'
      - 'mod_project/src/**'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: java21-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract project and apply tracked source overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mod-project"
          unzip -q mod.zip -d "$RUNNER_TEMP/mod-project"
          cp -a mod_project/src/. "$RUNNER_TEMP/mod-project/src/"
          chmod +x "$RUNNER_TEMP/mod-project/gradlew"
          java -version
          javac -version
      - name: Install CI-only fixture checks
        if: contains(github.event.head_commit.message, '[server-check]')
        run: cp ci/StructureRegressionChecks.java "$RUNNER_TEMP/mod-project/src/main/java/deepluckyblock/procedures/"
      - name: T232 structured-lab regression probe
        run: |
          P=mod_project/src/main/java/deepluckyblock
          fail=0
          need() {
            f=$1; shift
            if ! grep -q "$1" "$f"; then
              echo "::error title=T232-probe::$$f : marqueur absent -> $1"
              fail=1
            fi
          }
          P=$P
          need "$P/procedures/Structures5Procedure.java" "dlb.safetyAwaitTimeoutMs"
          need "$P/procedures/Structures5Procedure.java" "replanZone(level, cx0, cz0, cx1, cz1"
          need "$P/util/SafeSurface.java" "hasZoneTicket"
          need "$P/util/SafeSurface.java" "READY_TTL_MS"
          need "$P/util/ChunkKeeper.java" "coversChunk"
          need "$P/util/DebugLog.java" "dlb.debug"
          if [ $$fail -eq 1 ]; then
            echo "::error title=T232-probe::le correctif lab T232 a disparu d'au moins un fichier -- preventif contre un revert non controle"
            exit 1
          fi
          echo "T232-probe OK : accord sanitaire + borne attente + purge READY presents"

      - name: Build mod
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: '-Xmx2g -XX:ActiveProcessorCount=2'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mod-project"
          ./gradlew build --console=plain --max-workers=2 2>&1 | tee "$RUNNER_TEMP/java21-build.log"
      - name: Structures5 optimization campaign (variants)
        if: contains(github.event.head_commit.message, '[variants]')
        env:
          JAVA_TOOL_OPTIONS: '-Xmx2g -XX:ActiveProcessorCount=2'
        run: python3 ci/variants_server.py
      - name: Verify structures in one dedicated server session
        if: contains(github.event.head_commit.message, '[server-check]')
        env:
          JAVA_TOOL_OPTIONS: '-Xmx2g -XX:ActiveProcessorCount=2'
        run: python3 ci/server_check.py
      - name: Publish failure excerpt as annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'java21-build.log'
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              errs = [l for l in lines if 'error' in l.lower()]
              text = '\n'.join(errs[:40] + ['---tail---'] + lines[-60:])
              text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Build diagnostics::' + text)
          PY
      - name: Publish campaign results back to the repo
        if: always() && contains(github.event.head_commit.message, '[variants]')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          DIR="ci/results/$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID:-local}"
          mkdir -p "$DIR"
          cp -f "$RUNNER_TEMP"/variant-*.log "$DIR"/ 2>/dev/null || true
          cp -f "$RUNNER_TEMP/variants-summary.txt" "$DIR"/ 2>/dev/null || true
          cp -f "$RUNNER_TEMP/server-summary.txt" "$DIR"/ 2>/dev/null || true
          cp -f "$RUNNER_TEMP/server-check.log" "$DIR"/ 2>/dev/null || true
          cp -rf ci/results-now "$DIR"/ 2>/dev/null || true
          git config user.email "ci-result@deep-lucky-block.ci"
          git config user.name "DLB CI results"
          git add "$DIR"
          git commit -m "CI-RESULTS ($GITHUB_RUN_ID) : campagne variantes + server-check" || exit 0
          git fetch -q origin
          git pull --rebase -q origin ${GITHUB_REF#refs/heads/} || true
          git push -q origin HEAD:${GITHUB_REF#refs/heads/} || true
          exit 0
      - name: Export provisioned server runtime for local sandbox tests [runtime-export]
        if: contains(github.event.head_commit.message, '[runtime-export]')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "== bootstrap : provisionne completement le runtime serveur =="
          mkdir -p "$RUNNER_TEMP/mod-project/run"
          printf 'eula=true\n' > "$RUNNER_TEMP/mod-project/run/eula.txt"
          (cd "$RUNNER_TEMP/mod-project" && timeout 900 ./gradlew runServer --console=plain --max-workers=2 < /dev/null > "$RUNNER_TEMP/boot.log" 2>&1) &
          BPID=$!
          for i in $(seq 1 950); do
            grep -q "Done (" "$RUNNER_TEMP/boot.log" 2>/dev/null && break
            sleep 2
          done
          kill $BPID 2>/dev/null; sleep 3; kill -9 $BPID 2>/dev/null
          pkill -f "neoforge" 2>/dev/null; pkill -f "java.*runServer" 2>/dev/null
          tail -5 "$RUNNER_TEMP/boot.log"
          echo "== tailles avant tar =="
          du -sh /home/runner/.gradle/caches /home/runner/.gradle/wrapper "$RUNNER_TEMP/mod-project" 2>/dev/null
          echo "== tar + split <= 80 Mo =="
          rm -rf ci/runtime && mkdir -p ci/runtime/parts
          JAVA_RT=$(ls -d /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/21.* 2>/dev/null | head -1)
          echo "java runner: $JAVA_RT"
          tar -czf /tmp/runtime.tgz \
              -C "$RUNNER_TEMP" mod-project \
              -C /home/runner .gradle/caches .gradle/wrapper \
              -C /opt/hostedtoolcache Java_Temurin-Hotspot_jdk \
              --exclude='*/outputs/client*' --exclude='*build-cache-1' \
              --exclude='*.executionHistory' 2>/dev/null || true
          ls -la /tmp/runtime.tgz
          split -b 80m -d /tmp/runtime.tgz ci/runtime/parts/part-
          sha256sum ci/runtime/parts/* > ci/runtime/parts.sha256
          echo "gradle_boot_log_tail:" > ci/runtime/export-info.txt
          tail -30 "$RUNNER_TEMP/boot.log" >> ci/runtime/export-info.txt
          git config user.email "ci-result@deep-lucky-block.ci"
          git config user.name "DLB CI results"
          git add ci/runtime
          git commit -qm "CI-PROGRESS ($GITHUB_RUN_ID) : export runtime serveur pour tests sandbox" || exit 0
          git fetch -q origin ${GITHUB_REF_NAME}
          git pull --rebase -q origin ${GITHUB_REF_NAME} || true
          n=0
          until git push -q origin HEAD:${GITHUB_REF_NAME}; do
            n=$((n+1)); [ $n -gt 6 ] && break; sleep 5
            git pull --rebase -q origin ${GITHUB_REF_NAME} || true
          done
          exit 0

      - name: Export runner JDK for sandbox [runtime-jre]
        if: contains(github.event.head_commit.message, '[runtime-jre]')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "JAVA_HOME=$JAVA_HOME"
          ls -la /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/ 2>/dev/null | head
          ls -la ${JAVA_HOME:-/dev/null}/bin/java 2>/dev/null | head -2
          rm -rf ci/runtime-jre && mkdir -p ci/runtime-jre
          cp -rL "$JAVA_HOME"/. ci/runtime-jre/jdk/ 2>&1 | head -3 || cp -rL /usr/lib/jvm/temurin-21-jdk-amd64/. ci/runtime-jre/jdk/
          du -sh ci/runtime-jre/jdk > /tmp/jdk_size.txt
          NB=$(find ci/runtime-jre -type f | wc -l)
          echo "::notice title=JDK-EXPORT::JAVA_HOME=$JAVA_HOME taille=$(du -sh ci/runtime-jre/jdk | cut -f1) fichiers=$NB java-version=$(ci/runtime-jre/jdk/bin/java -version 2>&1 | head -1 || echo KO)"
          rm -rf ci/runtime-jre/jdk/demo ci/runtime-jre/jdk/man 2>/dev/null
          du -sh ci/runtime-jre
          tar -czf /tmp/jdk.tgz -C ci/runtime-jre jdk
          ls -la /tmp/jdk.tgz
          rm -rf ci/runtime-jre && mkdir -p ci/runtime-jre/parts
          split -b 80m -d /tmp/jdk.tgz ci/runtime-jre/parts/part-
          sha256sum ci/runtime-jre/parts/* > ci/runtime-jre/parts.sha256
          git config user.email "ci-result@deep-lucky-block.ci"
          git config user.name "DLB CI results"
          git add -f ci/runtime-jre
          STOFD=$(git status --short ci/runtime-jre | wc -l)
          echo "::notice title=JDK-EXPORT-2::fichiers ajoutes=$STOFD"
          git commit -qm "CI-PROGRESS ($GITHUB_RUN_ID) : export JDK runner" || exit 0
          git fetch -q origin ${GITHUB_REF_NAME}; git pull --rebase -q origin ${GITHUB_REF_NAME} || true
          n=0; until git push -q origin HEAD:${GITHUB_REF_NAME}; do n=$((n+1)); [ $n -gt 6 ] && break; sleep 5; git pull --rebase -q origin ${GITHUB_REF_NAME} || true; done
          exit 0

      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java21-build-diagnostics
          path: |
            ${{ runner.temp }}/java21-build.log
            ${{ runner.temp }}/server-check.log
            ${{ runner.temp }}/server-summary.txt
            ${{ runner.temp }}/mod-project/build/reports/
          if-no-files-found: warn
          retention-days: 7
